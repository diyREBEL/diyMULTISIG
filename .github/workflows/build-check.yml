# Prüft bei jedem Push, dass app/lib/vendor.js exakt aus den gepinnten Quellen in vendor-src/ entsteht
# (reproduzierbarer Build). Veröffentlicht wird über GitHub Pages "Deploy from a branch" (main, Hauptordner).
# Alle Actions sind auf einen festen Commit gepinnt (Schutz gegen nachträglich veränderte Versionen).
name: Build prüfen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: vendor.js neu bauen und vergleichen
        working-directory: vendor-src
        run: |
          npm ci --ignore-scripts
          node build.mjs
          git diff --exit-code -- ../app/lib/vendor.js
